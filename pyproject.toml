[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vordur"
version = "3.0.0"
description = "Standalone hardening library for MCP clients/servers and untrusted content"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Michael H. Coen", email = "mhcoen@gmail.com"}]
keywords = ["llm", "security", "prompt-injection", "mcp", "dlp", "privacy", "guardrails"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "beautifulsoup4>=4.12",
  # soupsieve is pulled in transitively by beautifulsoup4; pin to the patched
  # release for GHSA-2wc2-fm75-p42x (memory exhaustion, fixed in 2.8.4).
  "soupsieve>=2.8.4",
  "confusables>=1.2",
]

[project.urls]
Homepage = "https://mhcoen.github.io/vordur/"
Repository = "https://github.com/mhcoen/vordur"
Documentation = "https://github.com/mhcoen/vordur/blob/main/docs/README.md"
Changelog = "https://github.com/mhcoen/vordur/blob/main/CHANGELOG.md"
Issues = "https://github.com/mhcoen/vordur/issues"
Security = "https://github.com/mhcoen/vordur/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  # `yaml` is exercised by the policy-file tests, so a dev install gets it.
  "pyyaml>=6.0",
  # Likewise wasmtime, for the Rego tests. The `opa` compiler is a separate
  # matter: it is a Go binary rather than a wheel, so CI installs it in its own
  # step and the tests skip the compile-and-run cases when it is absent.
  "wasmtime>=25.0",
  # And cryptography, for the encrypted vault store. The store has no plaintext
  # fallback, so without this its tests skip and the only path that writes a
  # vault to disk is never exercised.
  "cryptography>=43.0",
]
# Reading a policy from a file, for a deployment that has no Python object to
# put one in. Optional because the library itself never needs it: a host that
# builds PolicyConfig in code should not carry a parser it does not call.
yaml = [
  "pyyaml>=6.0",
]
# Evaluating a Rego policy in process. Optional because it is a policy backend,
# not a control: everything the library enforces works without it. The WASM
# runtime is the only dependency; the `opa` binary is a build-time tool for
# whoever compiles the policy, never a runtime one.
rego = [
  "wasmtime>=25.0",
]
# Persisting the privacy vault to an encrypted local file. Optional because
# the vault is session state by default and most deployments want it that way.
# There is no unencrypted alternative behind this: a persisted vault is a
# re-identification database, so the store refuses to write without it rather
# than falling back to plaintext. The stdlib has no AEAD, and hand-rolling one
# inside a security product would cost more than the dependency does.
vault = [
  "cryptography>=43.0",
]
# Lint tooling is pinned so a new release cannot turn CI red on an unchanged
# commit. Dependabot tracks these and opens a PR when a version moves, so the
# upgrade lands as its own reviewable change.
lint = [
  "ruff==0.16.5",
  "bandit==1.9.4",
]
# Kept out of `dev` on purpose. The pip-audit job freezes the environment to
# build its audit set, so anything installed before that freeze gets audited.
# pip-audit pulls in requests, urllib3, certifi and more, and auditing its own
# tooling under --strict would fail the supply-chain gate on unrelated CVEs.
audit = [
  "pip-audit==2.10.1",
]
benchmarks = [
  "pyyaml>=6.0",
  "casbin>=1.36",
  "pydantic>=2.0",
  "jsonschema>=4.20",
  "certifi",
]
gpu = [
  "torch>=2.0",
  "transformers>=4.40",
  "huggingface_hub>=0.20",
  "accelerate>=0.25",
]
examples = [
  "torch>=2.0",
  "transformers>=4.40",
  "accelerate>=0.25",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vordur = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "eval_suite: parametrized benchmark eval suite for non-injection control surfaces",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "_site",
  "_serve_root",
  "benchmarks/data",
  "paper",
  ".venv",
  ".venv312",
  "dist",
  "artifacts",
  "local",
  "devel",
]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "W",     # pycodestyle warnings
  "I",     # isort
  "B",     # bugbear
  "UP",    # pyupgrade
  "S",     # bandit-like security checks
  "C4",    # comprehensions
  "PIE",   # misc
]
ignore = [
  "E501",  # line length (handled by formatter where possible)
  "S101",  # use of assert is fine in tests
  "S311",  # non-crypto random is fine for benchmark generators
  "B008",  # function-call-in-default is occasionally intentional for dataclass field()
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"benchmarks/**" = ["S", "B", "E402", "F841"]
"examples/**" = ["S", "B", "E402", "F841"]
"tutorials/**" = ["S", "B", "E402", "F841"]
"scripts/**" = ["S", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
