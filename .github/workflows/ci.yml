name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      # The Rego tests compile a policy fixture from its .rego source rather
      # than committing an opaque .wasm blob to a security repository. That
      # needs the OPA compiler, which is a Go binary and not a wheel. Pinned
      # like every other tool here so a new release cannot turn CI red on an
      # unchanged commit. Without this step those tests skip, which would mean
      # the WASM path is never exercised anywhere automatic.
      #
      # The download is verified against the checksum OPA publishes for this
      # release, so a substituted binary fails the step rather than running
      # the tests, and it is retried, because a transient download failure
      # has turned an unchanged commit red before.
      - name: Install OPA
        run: |
          expected=15f38338fda46ce4feb9fedfbbc5aab80786ed925b340ba9b8065ba3dbdd0ce5
          for attempt in 1 2 3; do
            curl -fsSL --retry 3 --retry-delay 5 -o opa \
              https://openpolicyagent.org/downloads/v1.14.0/opa_linux_amd64_static && break
            echo "download attempt $attempt failed"
            sleep 15
          done
          echo "$expected  opa" | sha256sum -c -
          install -m 0755 opa /usr/local/bin/opa
          opa version

      - name: Run tests
        run: |
          pytest -q

      - name: Run benchmarks
        run: |
          python benchmarks/run_benchmarks.py --checkpoint benchmarks/checkpoints/official-baseline.json --allow-extra-suites
