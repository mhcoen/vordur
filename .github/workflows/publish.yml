name: Publish

# Runs when a release tag is pushed. Builds once, publishes that exact build
# to PyPI through trusted publishing (no long-lived token in the repository),
# and attaches the same files to a GitHub release. The `pypi` environment is
# where PyPI's trusted-publisher registration points, so a tag pushed to a
# fork cannot publish.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches the declared version
        run: |
          declared=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v${declared}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${declared}"
            exit 1
          fi
      - name: Check the changelog names this version
        run: |
          grep -q "^## \[${GITHUB_REF_NAME#v}\] - " CHANGELOG.md
      - name: Build
        # Pinned like every other tool in this repository so a new release of
        # the build frontend cannot change what gets published.
        run: |
          python -m pip install build==1.6.0
          python -m build
      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import vordur; from vordur import Guard; Guard()"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what changed in this release."
